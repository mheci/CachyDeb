name: Check CachyOS updates and dispatch Debian 13 builds

on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Dispatch every variant even when upstream is unchanged"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: cachyos-update-check
  cancel-in-progress: false

env:
  UPSTREAM_REPO: CachyOS/linux-cachyos
  UPSTREAM_BRANCH: master
  BUILD_WORKFLOW: build-release.yml
  BUILD_RUNNER: blacksmith-16vcpu-ubuntu-2404
  STATE_FILE: cachyos-kernel-state.json
  FORCE_BUILD: ${{ inputs.force_build || (github.event.schedule == '0 4 * * 1') }}

jobs:
  check:
    name: Poll upstream and dispatch builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Detect upstream updates and dispatch builds
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          VARIANTS=(
            "linux-cachyos:cachyos"
            "linux-cachyos-bore:bore"
            "linux-cachyos-eevdf:eevdf"
            "linux-cachyos-lts:cachyos"
          )

          declare -A STORED
          if [[ -f "${STATE_FILE}" ]]; then
            while IFS='=' read -r key value; do
              [[ -n "${key}" ]] && STORED["${key}"]="${value}"
            done < <(python3 - "${STATE_FILE}" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              print(f"{key}={value}")
          PY
            )
          fi

          : > /tmp/summary.md
          fetch_errors=0
          dispatch_errors=0

          for entry in "${VARIANTS[@]}"; do
            variant="${entry%%:*}"
            scheduler="${entry##*:}"
            pkgbuild="/tmp/${variant}-PKGBUILD"

            if ! curl -fsSL --retry 3 --retry-delay 5 \
              "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_BRANCH}/${variant}/PKGBUILD" \
              -o "${pkgbuild}"; then
              echo "::warning::Could not fetch PKGBUILD for ${variant}"
              printf -- "- **%s**: upstream fetch failed\n" "${variant}" >> /tmp/summary.md
              fetch_errors=$((fetch_errors + 1))
              continue
            fi

            eval "$(bash scripts/upstream-version.sh "${pkgbuild}")"
            stored="${STORED[${variant}]:-}"
            action="unchanged"
            needs_build=false

            if [[ "${version}" != "${stored}" || "${FORCE_BUILD}" == "true" ]]; then
              needs_build=true
            fi

            if [[ "${needs_build}" == "true" ]]; then
              title="CachyOS ${variant} ${version}"
              running="$(gh run list \
                --workflow "${BUILD_WORKFLOW}" \
                --limit 100 \
                --json displayTitle,status \
                --jq ".[] | select(.displayTitle == \"${title}\") | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\") | .status" \
                | head -n1 || true)"

              if [[ -n "${running}" ]]; then
                action="already-${running}"
              elif gh workflow run "${BUILD_WORKFLOW}" \
                --ref "${DEFAULT_BRANCH}" \
                -f runner="${BUILD_RUNNER}" \
                -f kernel_variant="${variant}" \
                -f cpu_scheduler="${scheduler}" \
                -f expected_version="${version}" \
                -F publish_release=true \
                -F run_boot_tests=true \
                -F fail_on_critical_cve=false; then
                action="dispatched"
              else
                action="dispatch-failed"
                dispatch_errors=$((dispatch_errors + 1))
              fi
            fi

            printf -- "- **%s**: upstream %s, stored %s, action %s\n" \
              "${variant}" "${version}" "${stored:-none}" "${action}" >> /tmp/summary.md
          done

          {
            echo "## CachyOS update check"
            echo ""
            echo "Polled \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`; force build: \`${FORCE_BUILD}\`."
            echo ""
            cat /tmp/summary.md
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${fetch_errors}" -gt 0 ]]; then
            echo "::error::${fetch_errors} upstream variant(s) could not be checked"
            exit 1
          fi
          if [[ "${dispatch_errors}" -gt 0 ]]; then
            echo "::error::${dispatch_errors} build(s) could not be dispatched"
            exit 1
          fi
